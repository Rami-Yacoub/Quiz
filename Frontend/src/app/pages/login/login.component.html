<app-navbar></app-navbar>
<div class="bootstrap-wrapper">
    <div class="container" style="margin-top: 80px;">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <mat-card class="mat-card" style="padding: 40px;">
                    <div class="login-header-icon">
                        <mat-icon style="font-size: 32px; height: 32px; width: 32px;">lock</mat-icon>
                    </div>
                    <h1 class="text-center" style="margin-bottom: 32px;">Welcome Back</h1>
                    <form (ngSubmit)="submit()">
                        <mat-form-field class="full-width" appearance="outline">
                            <mat-label>Username</mat-label>
                            <input required name="username" [(ngModel)]="loginDetails.username" matInput placeholder="Enter your username">   
                            <mat-icon matSuffix color="primary">person</mat-icon>
                        </mat-form-field>
                        <mat-form-field class="full-width" appearance="outline">
                            <mat-label>Password</mat-label>
                            <input required [(ngModel)]="loginDetails.password" name="password" type="password" matInput placeholder="Enter your password">
                            <mat-icon matSuffix color="primary">key</mat-icon>
                        </mat-form-field>
                        <div class="container text-center" style="margin-top: 24px;">
                            <button type="submit" mat-raised-button color="primary">Sign in</button>
                            <button type="button" style="margin-left: 10px;" mat-raised-button color="warn">Clear</button>
                        </div>
                    </form>
                </mat-card>
            </div>
        </div>
    </div>
</div>
